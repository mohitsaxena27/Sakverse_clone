server {
    listen 5175 ssl;
    server_name tcg.saksoft.com;

    root /usr/share/nginx/html;
    index index.html;

    # SSL certificate
    ssl_certificate /etc/ssl/certs/certificate.crt;
    ssl_certificate_key /etc/ssl/certs/private.key;

    # SPA routing (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Proxy backend API
    location /sakverse {
        proxy_pass https://node-proxy-backend:3000;
        proxy_hide_header Content-Security-Policy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Disable SSL verification for self-signed backend (if needed)
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3600s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        send_timeout          3600s;
        proxy_buffering off;

    }

    # Proxy WebSocket live-stream endpoint
    location /view/ {
        proxy_pass https://node-proxy-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Disable SSL verification for self-signed backend (if needed)
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3600s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        send_timeout          3600s;
        proxy_buffering off;

    }

    # Security headers
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "require-corp";
    add_header Cross-Origin-Resource-Policy "same-site";

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://vm-dev-access.centralindia.cloudapp.azure.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none';" always;
}